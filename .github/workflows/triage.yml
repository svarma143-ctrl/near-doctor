name: Triage friction report

# Deterministic triage: match the report against the friction log, or draft a rule skeleton.
# The issue body is untrusted input: it is only ever read from the event JSON file by the script and
# is never interpolated into a shell command.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'friction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Match against the friction log
        run: node scripts/triage.mjs --event "$GITHUB_EVENT_PATH" --comment-file comment.md --draft-dir drafts
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
      - name: Keep any draft rule for the maintainer
        uses: actions/upload-artifact@v7
        with:
          name: draft-rule
          path: drafts
          if-no-files-found: ignore
